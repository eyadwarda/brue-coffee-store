<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>brüe — Store Admin</title><link rel="stylesheet" href="styles.css"><style>
.admin-wrap{max-width:1100px;margin:auto;padding:65px 6%}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.admin-top h1{font:48px "Playfair Display";margin:10px 0}.admin-note{color:#bda997;font-size:12px;line-height:1.7;max-width:680px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:35px 0}.stat{border:1px solid #ffffff20;padding:22px;background:#2a1e17}.stat span{font-size:10px;color:#bda997;letter-spacing:1px}.stat strong{display:block;font:32px "Playfair Display";margin-top:10px}.orders{width:100%;border-collapse:collapse;margin-top:25px;font-size:12px}.orders th,.orders td{text-align:left;padding:15px 10px;border-bottom:1px solid #ffffff20;vertical-align:top}.orders th{color:#c99d79;font-size:9px;letter-spacing:1.5px}.orders select{background:#2a1e17;color:#f1e4d3;border:1px solid #82634d;padding:7px}.empty{padding:35px;text-align:center;border:1px dashed #80644e;color:#bda997}.admin-actions{display:flex;gap:10px}.admin-actions button,.admin-login button{background:transparent;color:#f1e4d3;border:1px solid #82634d;padding:10px 14px;cursor:pointer;font-size:12px}.admin-login{max-width:420px;margin:50px auto;padding:25px;border:1px solid #ffffff20;background:#2a1e17}.admin-login label{display:block;color:#bda997;font-size:12px}.admin-login input{display:block;width:100%;box-sizing:border-box;margin:10px 0 15px;padding:12px;background:#211711;color:#fff;border:1px solid #82634d}.error{color:#ffb4a8;font-size:12px;min-height:18px}@media(max-width:650px){.stats{grid-template-columns:1fr}.orders{font-size:10px}.orders th,.orders td{padding:10px 5px}}
</style></head><body><header class="topbar"><a class="logo" href="index.html">br<span>ü</span>e<span class="dot">.</span></a><nav><a href="index.html">View store ↗</a></nav><span class="eyebrow">STORE ADMIN</span></header><main class="admin-wrap">
<section id="loginPanel" class="admin-login"><p class="eyebrow">SECURE ACCESS</p><h2>Admin login.</h2><form id="loginForm"><label>Admin password<input id="adminPassword" type="password" autocomplete="current-password" required></label><button type="submit">Sign in ↗</button><p id="loginError" class="error"></p></form></section>
<section id="dashboard" hidden><div class="admin-top"><div><p class="eyebrow">YOUR STORE, AT A GLANCE</p><h1>Orders<span style="color:#c99d79">.</span></h1><p class="admin-note">Orders are loaded from your online PostgreSQL database.</p></div><div class="admin-actions"><button id="refresh">Refresh</button><button id="export">Export CSV</button><button id="logout">Log out</button></div></div><div class="stats"><div class="stat"><span>TOTAL ORDERS</span><strong id="count">0</strong></div><div class="stat"><span>ORDER VALUE</span><strong id="revenue">EGP 0</strong></div><div class="stat"><span>NEW ORDERS</span><strong id="newCount">0</strong></div></div><div id="orderTable"></div></section>
</main><script src="admin.js"></script></body></html>
